<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#57606a" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Top: Web Console -->
  <g filter="url(#shadow)">
    <rect x="40" y="24" width="800" height="88" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="440" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">React 18 Web 审计控制台 (Vite 6)</text>
    <text x="440" y="78" text-anchor="middle" font-size="12.5" fill="#57606a">Home · Dashboard · NewAnalysis · Tasks · Static · Dynamic · Traffic · Reports · Comparisons · Environment · Settings</text>
    <text x="440" y="96" text-anchor="middle" font-size="11.5" fill="#0969da">SiteNav 全景导航体系与响应式双主题架构</text>
  </g>

  <!-- Connection 1 -->
  <path d="M 440 112 L 440 148" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="310" y="120" width="260" height="20" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="440" y="134" text-anchor="middle" font-size="11" fill="#57606a">HTTP / REST / WebSocket (实时进度与日志)</text>

  <!-- Middle: FastAPI Engine -->
  <g filter="url(#shadow)">
    <rect x="40" y="150" width="800" height="180" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="440" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">FastAPI 本地合规取证引擎</text>

    <!-- Subcard 1 -->
    <rect x="60" y="194" width="240" height="118" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="180" y="220" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">任务执行中心</text>
    <text x="80" y="246" font-size="12" fill="#57606a">• SQLite 任务持久化与步骤记录</text>
    <text x="80" y="270" font-size="12" fill="#57606a">• 设备排他租约与状态原子快照</text>
    <text x="80" y="294" font-size="12" fill="#57606a">• 优雅取消与 finally 资源清理</text>

    <!-- Subcard 2 -->
    <rect x="320" y="194" width="240" height="118" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="440" y="220" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">确定性分析矩阵</text>
    <text x="340" y="246" font-size="12" fill="#57606a">• Manifest 解析与四级敏感权限</text>
    <text x="340" y="270" font-size="12" fill="#57606a">• 商业/广告/统计 SDK 指纹库</text>
    <text x="340" y="294" font-size="12" fill="#57606a">• 单调时钟 Consent 判定规则</text>

    <!-- Subcard 3 -->
    <rect x="580" y="194" width="240" height="118" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="700" y="220" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">受控 AI 编排</text>
    <text x="600" y="246" font-size="12" fill="#57606a">• 白名单工具 DAG 计划生成</text>
    <text x="600" y="270" font-size="12" fill="#57606a">• Evidence Digest 语义压缩缓存</text>
    <text x="600" y="294" font-size="12" fill="#57606a">• Windows DPAPI 硬件密钥存储</text>
  </g>

  <!-- Connections down -->
  <path d="M 230 330 L 230 366" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 650 330 L 650 366" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Bottom: Hardware & Storage -->
  <!-- Bottom Left -->
  <g filter="url(#shadow)">
    <rect x="40" y="368" width="380" height="108" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="230" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Android 目标设备 / 模拟器</text>
    <text x="64" y="422" font-size="12" fill="#57606a">• ADB 会话管理与通信稳定性探针</text>
    <text x="64" y="444" font-size="12" fill="#57606a">• Frida 17 离线 Java Bridge 插桩与崩溃监控</text>
    <text x="64" y="466" font-size="12" fill="#57606a">• mitmproxy 独立代理会话与 Zero-Leak 最小化</text>
  </g>

  <!-- Bottom Right -->
  <g filter="url(#shadow)">
    <rect x="460" y="368" width="380" height="108" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="650" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">本地持久化状态与产物</text>
    <text x="484" y="422" font-size="12" fill="#57606a">• SQLite 任务状态机数据库 (WAL 模式)</text>
    <text x="484" y="444" font-size="12" fill="#57606a">• SHA-256 APK 静态解包高速缓存目录</text>
    <text x="484" y="466" font-size="12" fill="#57606a">• output/runs/ 结构化审计证据与报告归档</text>
  </g>
</svg>