[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adsdk-agent"
version = "0.2.0"
description = "面向 Android APK 的本地隐私合规审计与取证分析平台"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "AdSDK Agent Team" }
]
keywords = ["android", "privacy", "compliance", "frida", "mitmproxy", "security"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dynamic = [
    "frida>=16.0.0",
    "frida-tools>=12.0.0",
    "mitmproxy>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]
all = [
    "adsdk-agent[dynamic,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["web*", "tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 2

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".vite",
    "output",
    "web",
    "scripts/frida-agent/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# UP042 suggests StrEnum; keep str+Enum to preserve serialization semantics.
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = [
    "app/core",
    "app/orchestration",
    "app/traffic",
    "app/pipelines",
    "app/api",
    "app/frida/diagnostics.py",
    "app/frida/server_manager.py",
    "app/frida/execution_session.py",
]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "app.core.*",
    "app.orchestration.*",
    "app.traffic.*",
    "app.pipelines.*",
    "app.api.*",
    "app.frida.diagnostics",
    "app.frida.server_manager",
    "app.frida.execution_session",
]
check_untyped_defs = true

