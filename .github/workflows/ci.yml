name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js for Frida Agent Build
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frida Hook Agent
        run: |
          npm ci --prefix scripts/frida-agent
          python scripts/build_frida_agent.py

      - name: Run Ruff Lint
        run: ruff check app tests scripts

      - name: Run Ruff Format Check
        run: ruff format --check app tests scripts

      - name: Run Mypy Typecheck
        run: mypy

      - name: Run Pytest
        run: pytest -q

      - name: Check OpenAPI Schema Drift
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json

  backend-static-isolated:
    name: Backend Static & Unit Isolated (No Frida/Mitmproxy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install isolated dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Checks
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts

      - name: Run Pytest
        run: pytest -q

  frontend-check:
    name: Frontend Quality & Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Verify Generated API Types Up To Date
        run: |
          npm --prefix web run gen:api
          git diff --exit-code web/src/types/openapi.ts

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Run Vitest
        run: npm --prefix web test

      - name: Build Web
        run: npm --prefix web run build
